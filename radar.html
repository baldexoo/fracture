<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radar</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%;
        background: #141414; overflow: hidden; user-select: none;
      }
      .hud {
        display: flex; flex-direction: column;
        width: 100%; height: 100%; background: #1a1a1a;
      }
      .cap { flex: 0 0 28px; background: #222; }
      .rule { flex: 0 0 3px; background: #e8c84a; }
      .stage { flex: 1 1 auto; min-height: 0; background: #000; }
      canvas { display: block; width: 100%; height: 100%; background: #000; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="cap"></div>
      <div class="rule"></div>
      <div class="stage">
        <canvas id="view" width="300" height="180"></canvas>
      </div>
    </div>
    <script>
      try {
        if (window.opener) window.opener.postMessage({ type: "fracture-hud-ready", kind: "radar" }, "*");
      } catch (e) {}
      window.addEventListener("pagehide", () => {
        try {
          if (window.opener) window.opener.postMessage({ type: "fracture-hud-closed", kind: "radar" }, "*");
        } catch (e) {}
      });
    </script>
  </body>
</html>
